name: CI

# Bible Section 31.2 CI/CD gates: lint/format/typecheck, unit tests,
# migration validation, build, E2E/smoke tests, dependency scanning.
# Section 42.1's "mandatory checkpoint after each slice" is what this
# workflow automates.

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cedarpoint_ci
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-only-secret-not-for-production-0000000000000000
  PGPASSWORD: postgres

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cedarpoint_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Write CI env file
        run: |
          cat > .env << EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          SESSION_SECRET=${SESSION_SECRET}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Validate Postgres migrations apply cleanly
        run: npm run db:migrate:deploy

      - name: Create and migrate the integration test database
        # apps/web's vitest.config.ts points integration tests at
        # cedarpoint_test by default — separate from cedarpoint_ci so
        # bootstrapOrganization's "no organization exists yet" happy path
        # has a real empty database to run against.
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE cedarpoint_test;"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cedarpoint_test npm run db:migrate:deploy

      - name: Unit + integration tests
        run: npm run test

      - name: Build apps/web
        run: npm run build --workspace apps/web

      - name: Install Playwright's Chromium
        # No pre-installed browser here (unlike the sandbox
        # playwright.config.ts also supports — see its own comment):
        # a real managed download, with the OS-level libs headless
        # Chromium needs on a bare Ubuntu runner.
        run: npx playwright install --with-deps chromium

      - name: E2E / smoke tests (Section 31.2 "build...and run smoke tests")
        # test:e2e resets cedarpoint_ci to a known seeded state, clears
        # any stale rate-limit buckets, then drives a real browser
        # against a real production build (playwright.config.ts's own
        # webServer builds + starts apps/web) — see tests/e2e/README.md.
        run: npm run test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: false
